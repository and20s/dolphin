{
 "name": "Build Dolphin Android (debug)",
 "on": {
  "workflow_dispatch": {},
  "push": {
   "branches": [
    "master"
   ],
   "paths": [
    ".github/workflows/build-dolphin-json.yml"
   ]
  }
 },
 "jobs": {
  "build": {
   "runs-on": "ubuntu-24.04",
   "timeout-minutes": 300,
   "steps": [
    {
     "name": "Free disk space",
     "run": "sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk/25* /usr/local/share/boost || true\ndf -h /\n"
    },
    {
     "name": "Checkout (without submodules)",
     "uses": "actions/checkout@v4",
     "with": {
      "fetch-depth": 0
     }
    },
    {
     "name": "Fetch submodules (skip Windows-only Qt and FFmpeg)",
     "run": "git config --file .gitmodules --get-regexp '\\.path$' | awk '{print $2}' \\\n  | grep -v -e '^Externals/Qt$' -e '^Externals/FFmpeg-bin$' > submodules.txt\ncat submodules.txt\nxargs -a submodules.txt git submodule update --init --depth 1 --recursive\n"
    },
    {
     "name": "Build arm64 only",
     "run": "python3 - <<'PY'\np = 'Source/Android/app/build.gradle.kts'\ns = open(p, encoding='utf-8', newline='').read()\nold = 'abiFilters += listOf(\"arm64-v8a\", \"x86_64\")'\nassert s.count(old) == 1, 'abiFilters line not found exactly once'\nopen(p, 'w', encoding='utf-8', newline='').write(s.replace(old, 'abiFilters += listOf(\"arm64-v8a\")'))\nprint('arm64 only')\nPY\n"
    },
    {
     "name": "HotD tweaks - Z reload, pointer edges, landscape",
     "run": "python3 - <<'PY'\nimport re\np = 'Source/Android/app/src/main/java/org/dolphinemu/dolphinemu/overlay/InputOverlay.kt'\ns = open(p, encoding='utf-8', newline='').read()\n\n# 1) helper: while the on-screen Nunchuk Z button is held, push the IR pointer off the top of\n#    the screen (this is the reload gesture of House of the Dead 2&3 Return); restore on release.\nanchor = '    fun initTouchPointer() {'\nassert s.count(anchor) == 1, 'initTouchPointer anchor'\nhelper = '''    private var zHeld = false\n    private var reloadUntil = 0L\n\n    private fun reloadActive(): Boolean =\n        zHeld || android.os.SystemClock.uptimeMillis() < reloadUntil\n\n    private fun restorePointerY() {\n        if (!reloadActive())\n            InputOverrider.setControlState(\n                controllerIndex,\n                ControlId.WIIMOTE_IR_Y,\n                -(overlayPointer?.y?.toDouble() ?: 0.0)\n            )\n    }\n\n    private fun applyReloadHide(control: Int, down: Boolean) {\n        if (control != ControlId.NUNCHUK_Z_BUTTON)\n            return\n        if (down) {\n            zHeld = true\n            // keep the pointer off-screen at least this long, so even a quick tap reloads\n            reloadUntil = android.os.SystemClock.uptimeMillis() + 150\n            InputOverrider.setControlState(controllerIndex, ControlId.WIIMOTE_IR_Y, 1.6)\n        } else {\n            zHeld = false\n            val wait = reloadUntil - android.os.SystemClock.uptimeMillis()\n            android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(\n                { restorePointerY() }, if (wait > 0) wait + 10 else 0\n            )\n        }\n    }\n\n'''\ns = s.replace(anchor, helper + anchor)\n\n# 2) call it after the button state is applied (touch down and touch up)\nline = re.compile(r'^([ \\t]*)InputOverrider\\.setControlState\\(controllerIndex, button\\.control, if \\(button\\.getPressedState\\(\\)\\) 1\\.0 else 0\\.0\\)[ \\t]*$', re.M)\ns, n = line.subn(lambda m: m.group(0) + '\\n' + m.group(1) + 'applyReloadHide(button.control, button.getPressedState())', s)\nassert n == 2, 'expected 2 button state lines, got %d' % n\nold = '''            InputOverrider.setControlState(\n                controllerIndex,\n                ControlId.WIIMOTE_IR_Y,\n                -overlayPointer!!.y.toDouble()\n            )\n'''\nassert s.count(old) == 1, 'pointer IR_Y block'\ns = s.replace(old, '''            if (!reloadActive())\n                InputOverrider.setControlState(\n                    controllerIndex,\n                    ControlId.WIIMOTE_IR_Y,\n                    -overlayPointer!!.y.toDouble()\n                )\n''')\nopen(p, 'w', encoding='utf-8', newline='').write(s)\nprint('reload tweak applied')\n\n# 3) Touching the black bars (outside the game image) used to push the pointer off screen and\n#    the game ignored it. Clamp the touch pointer to the edge of the game image instead.\np = 'Source/Android/app/src/main/java/org/dolphinemu/dolphinemu/overlay/InputOverlayPointer.kt'\ns = open(p, encoding='utf-8', newline='').read()\ncrlf = '\\r\\n' in s\ns = s.replace('\\r\\n', '\\n')\npairs = [\n    ('            x = (event.getX(eventPointerIndex) - gameCenterX) * gameWidthHalfInv\\n',\n     '            x = ((event.getX(eventPointerIndex) - gameCenterX) * gameWidthHalfInv).coerceIn(-LIMIT_X, LIMIT_X)\\n'),\n    ('            y = (event.getY(eventPointerIndex) - gameCenterY) * gameHeightHalfInv\\n',\n     '            y = ((event.getY(eventPointerIndex) - gameCenterY) * gameHeightHalfInv).coerceIn(-LIMIT_Y, LIMIT_Y)\\n'),\n    ('            x = oldX + (event.getX(eventPointerIndex) - touchStartX) * gameWidthHalfInv\\n',\n     '            x = (x + (event.getX(eventPointerIndex) - lastTouchX) * gameWidthHalfInv).coerceIn(-LIMIT_X, LIMIT_X)\\n'),\n    ('            y = oldY + (event.getY(eventPointerIndex) - touchStartY) * gameHeightHalfInv\\n',\n     '            y = (y + (event.getY(eventPointerIndex) - lastTouchY) * gameHeightHalfInv).coerceIn(-LIMIT_Y, LIMIT_Y)\\n'),\n]\nfor old, new in pairs:\n    assert s.count(old) == 1, 'pointer anchor not found exactly once: ' + old.strip()\n    s = s.replace(old, new)\nif crlf:\n    s = s.replace('\\n', '\\r\\n')\nopen(p, 'w', encoding='utf-8', newline='').write(s)\nprint('pointer clamp applied')\n\np = 'Source/Android/app/src/main/java/org/dolphinemu/dolphinemu/overlay/InputOverlayPointer.kt'\ns = open(p, encoding='utf-8', newline='').read()\ncrlf = '\\r\\n' in s\ns = s.replace('\\r\\n', '\\n')\nextra = [\n    ('    private var touchStartY = 0f\\n',\n     '    private var touchStartY = 0f\\n    private var lastTouchX = 0f\\n    private var lastTouchY = 0f\\n'),\n    ('                touchStartY = event.getY(pointerIndex)\\n',\n     '                touchStartY = event.getY(pointerIndex)\\n                lastTouchX = touchStartX\\n                lastTouchY = touchStartY\\n'),\n    ('''                if (trackId == event.getPointerId(pointerIndex))\n                    trackId = -1\n                if (mode == MODE_DRAG)\n                    updateOldAxes()\n                if (recenter)\n                    reset()\n''', '''                if (trackId == event.getPointerId(pointerIndex)) {\n                    trackId = -1\n                    if (mode == MODE_DRAG)\n                        updateOldAxes()\n                    if (recenter)\n                        reset()\n                }\n'''),\n    ('        const val MODE_DISABLED = 0\\n',\n     '        // Fraction of the full IR range the pointer may use: keeps the reticle inside the game screen\\n        const val LIMIT_X = 0.85f\\n        const val LIMIT_Y = 0.85f\\n        const val MODE_DISABLED = 0\\n'),\n]\nfor old, new in extra:\n    assert s.count(old) == 1, 'limit anchor: ' + old.strip()\n    s = s.replace(old, new)\n# a second finger must not steal the finger that is already aiming\nold = '''                trackId = event.getPointerId(pointerIndex)\n                touchStartX = event.getX(pointerIndex)\n                touchStartY = event.getY(pointerIndex)\n                lastTouchX = touchStartX\n                lastTouchY = touchStartY\n                touchPress()\n'''\nassert s.count(old) == 1, 'pointer down block'\ns = s.replace(old, '''                if (trackId == -1 || event.findPointerIndex(trackId) == -1) {\n                    trackId = event.getPointerId(pointerIndex)\n                    touchStartX = event.getX(pointerIndex)\n                    touchStartY = event.getY(pointerIndex)\n                    lastTouchX = touchStartX\n                    lastTouchY = touchStartY\n                    touchPress()\n                }\n''')\nold = 'y = (y + (event.getY(eventPointerIndex) - lastTouchY) * gameHeightHalfInv).coerceIn(-LIMIT_Y, LIMIT_Y)\\n'\nassert s.count(old) == 1, 'drag y line'\ns = s.replace(old, old + '            lastTouchX = event.getX(eventPointerIndex)\\n            lastTouchY = event.getY(eventPointerIndex)\\n')\nif crlf:\n    s = s.replace('\\n', '\\r\\n')\nopen(p, 'w', encoding='utf-8', newline='').write(s)\nprint('pointer limit applied')\n\n# 4) Always landscape: no portrait, and no orientation option in the settings\np = 'Source/Android/app/src/main/java/org/dolphinemu/dolphinemu/activities/EmulationActivity.kt'\ns = open(p, encoding='utf-8', newline='').read()\ncrlf = '\\r\\n' in s\ns = s.replace('\\r\\n', '\\n')\nold = '        requestedOrientation = IntSetting.MAIN_EMULATION_ORIENTATION.int\\n'\nassert s.count(old) == 1, 'EmulationActivity orientation line'\ns = s.replace(old, '        requestedOrientation = android.content.pm.ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE\\n')\nif crlf:\n    s = s.replace('\\n', '\\r\\n')\nopen(p, 'w', encoding='utf-8', newline='').write(s)\n\np = 'Source/Android/app/src/main/java/org/dolphinemu/dolphinemu/features/settings/ui/SettingsFragmentPresenter.kt'\ns = open(p, encoding='utf-8', newline='').read()\ncrlf = '\\r\\n' in s\ns = s.replace('\\r\\n', '\\n')\nold = '        if (packageManager.hasSystemFeature(PackageManager.FEATURE_SCREEN_PORTRAIT) == packageManager.hasSystemFeature(\\n'\nassert s.count(old) == 1, 'orientation setting condition'\ns = s.replace(old, '        if (false && packageManager.hasSystemFeature(PackageManager.FEATURE_SCREEN_PORTRAIT) == packageManager.hasSystemFeature(\\n')\nif crlf:\n    s = s.replace('\\n', '\\r\\n')\nopen(p, 'w', encoding='utf-8', newline='').write(s)\n\np = 'Source/Android/app/src/main/AndroidManifest.xml'\ns = open(p, encoding='utf-8', newline='').read()\ncrlf = '\\r\\n' in s\ns = s.replace('\\r\\n', '\\n')\nold = '            android:name=\".activities.EmulationActivity\"\\n            android:exported=\"false\"\\n'\nassert s.count(old) == 1, 'EmulationActivity manifest entry'\ns = s.replace(old, old + '            android:screenOrientation=\"sensorLandscape\"\\n')\nif crlf:\n    s = s.replace('\\n', '\\r\\n')\nopen(p, 'w', encoding='utf-8', newline='').write(s)\nprint('landscape applied')\nPY\n"
    },
    {
     "name": "Set up JDK 17",
     "uses": "actions/setup-java@v4",
     "with": {
      "distribution": "temurin",
      "java-version": 17
     }
    },
    {
     "name": "Install NDK and CMake",
     "run": "yes | \"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager\" --licenses > /dev/null || true\n\"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager\" \"cmake;3.31.6\" \"ndk;30.0.15729638\"\n"
    },
    {
     "name": "Fixed debug signing key",
     "run": "mkdir -p ~/.android\necho '' | base64 -d > ~/.android/debug.keystore\n"
    },
    {
     "name": "Build debug APK",
     "working-directory": "Source/Android",
     "run": "chmod +x gradlew\nset -o pipefail\n./gradlew --no-daemon assembleDebug --stacktrace 2>&1 | tee ../../gradle-build.log\n",
     "env": {
      "ORG_GRADLE_PROJECT_android.native.buildOutput": "verbose"
     }
    },
    {
     "name": "Summary of errors",
     "if": "failure()",
     "run": "grep -n -B2 -A12 \"What went wrong\" gradle-build.log | head -60 || true\ngrep -n \"FAILED:\\|error:\" gradle-build.log | head -40 || true\n"
    },
    {
     "name": "Upload APK",
     "if": "success()",
     "uses": "actions/upload-artifact@v4",
     "with": {
      "name": "dolphin-debug-apk",
      "path": "Source/Android/app/build/outputs/apk/debug/*.apk"
     }
    },
    {
     "name": "Upload logs",
     "if": "failure()",
     "uses": "actions/upload-artifact@v4",
     "with": {
      "name": "build-logs",
      "path": "gradle-build.log"
     }
    }
   ]
  }
 }
}